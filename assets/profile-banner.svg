<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Harsha — building useful software</title>
  <desc id="description">A dark blue illustrated banner with a code panel showing a tested and production-ready portfolio build.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a39"/>
      <stop offset="0.55" stop-color="#11152b"/>
      <stop offset="1" stop-color="#092b38"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a5b4fc" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#background)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <circle cx="1020" cy="12" r="220" fill="url(#glow)"/>
  <circle cx="62" cy="334" r="160" fill="#22d3ee" opacity="0.06"/>
  <path d="M0 280C200 220 310 390 514 304s370-49 686-162v198H0Z" fill="#0b1226" opacity="0.36"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="62" y="58" width="220" height="30" rx="15" fill="#1e293b" stroke="#475569"/>
    <circle cx="80" cy="73" r="4" fill="#34d399"/>
    <text x="94" y="78" fill="#cbd5e1" font-size="12" font-weight="700" letter-spacing="1.5">BUILD · TEST · SHIP</text>

    <text x="62" y="158" fill="#f8fafc" font-size="54" font-weight="750" letter-spacing="-1.8">Hi, I'm Harsha.</text>
    <text x="64" y="202" fill="#c4b5fd" font-size="24" font-weight="600">I turn ideas into useful software.</text>
    <text x="64" y="243" fill="#94a3b8" font-size="16">Full-stack experiences, thoughtful systems, and a little polish.</text>

    <g transform="translate(704 58)" filter="url(#shadow)">
      <rect width="432" height="224" rx="16" fill="#0b1020" stroke="#334155"/>
      <path d="M0 16a16 16 0 0 1 16-16h400a16 16 0 0 1 16 16v31H0Z" fill="#171d31"/>
      <circle cx="23" cy="23" r="5" fill="#fb7185"/>
      <circle cx="41" cy="23" r="5" fill="#fbbf24"/>
      <circle cx="59" cy="23" r="5" fill="#34d399"/>
      <text x="82" y="27" fill="#94a3b8" font-size="12" font-family="Consolas, monospace">portfolio / delivery.log</text>

      <g font-family="Consolas, 'Courier New', monospace" font-size="15">
        <text x="27" y="83" fill="#64748b">$</text>
        <text x="45" y="83" fill="#e2e8f0">npm run validate</text>
        <text x="27" y="119" fill="#34d399">✓</text>
        <text x="48" y="119" fill="#cbd5e1">typecheck</text>
        <text x="27" y="151" fill="#34d399">✓</text>
        <text x="48" y="151" fill="#cbd5e1">lint + format</text>
        <text x="27" y="183" fill="#34d399">✓</text>
        <text x="48" y="183" fill="#cbd5e1">tests + production build</text>
      </g>
      <rect x="28" y="199" width="8" height="15" rx="2" fill="#a78bfa"/>
    </g>

    <text x="1118" y="314" fill="#64748b" font-size="12" text-anchor="end" letter-spacing="1.2">IRVING, TEXAS</text>
  </g>
</svg>
